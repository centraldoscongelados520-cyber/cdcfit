<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDC Fit — Estoque Matéria Prima</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --red: #E8271A;
    --red-dark: #b81d12;
    --bg: #111113;
    --surface: #1c1c1f;
    --surface2: #26262a;
    --border: #333336;
    --text: #f0f0f0;
    --muted: #888;
    --green: #22c55e;
    --orange: #f97316;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  header {
    background: var(--surface); border-bottom: 2px solid var(--red);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-size: 18px; font-weight: 800; color: var(--red); }
  .logo span { color: var(--text); }
  #clock { font-size: 13px; color: var(--muted); margin-left: auto; }

  .toolbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .search-box {
    flex: 1; min-width: 180px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 14px; outline: none;
  }
  .search-box:focus { border-color: var(--red); }
  .search-box::placeholder { color: var(--muted); }
  .btn-tool {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-tool:hover { color: var(--text); border-color: #555; }

  /* STATS */
  .stats-bar {
    display: flex; gap: 0; background: var(--surface);
    border-bottom: 1px solid var(--border); overflow-x: auto;
  }
  .stat {
    text-align: center; padding: 10px 20px; border-right: 1px solid var(--border); white-space: nowrap;
  }
  .stat-val { font-size: 20px; font-weight: 800; }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-val.red { color: var(--red); }
  .stat-val.orange { color: var(--orange); }
  .stat-val.green { color: var(--green); }

  /* FILTROS CATEGORIA */
  .filters {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .filter-btn {
    padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
    font-size: 12px; font-weight: 600; cursor: pointer;
    background: var(--surface); color: var(--muted); transition: all 0.15s;
  }
  .filter-btn.active { color: #fff; border-color: transparent; }

  /* CATEGORIAS COM CORES */
  .cat-color-proteinas  { --cc: #dc2626; }
  .cat-color-hortifruti { --cc: #16a34a; }
  .cat-color-laticinios { --cc: #ca8a04; }
  .cat-color-temperos   { --cc: #7c3aed; }
  .cat-color-seco       { --cc: #0369a1; }
  .cat-color-limpeza    { --cc: #0f766e; }
  .cat-color-massas     { --cc: #c2410c; }
  .cat-color-doces      { --cc: #be185d; }

  .filter-btn.active { background: var(--cc, var(--red)); }

  /* SEÇÃO */
  .section { padding: 0 16px 16px; }
  .section-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 0 8px;
    border-bottom: 1px solid var(--border); margin-bottom: 8px;
  }
  .section-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--cc, var(--red)); }
  .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .section-count { font-size: 12px; color: var(--muted); margin-left: auto; }

  /* TABELA */
  .item-table { width: 100%; border-collapse: collapse; }
  .item-table th {
    font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
    padding: 6px 8px; text-align: left; font-weight: 600;
  }
  .item-table th:last-child { text-align: center; }
  .item-row { border-top: 1px solid var(--border); transition: background 0.1s; }
  .item-row:hover { background: var(--surface); }
  .item-row.zero { background: rgba(232,39,26,0.06); }
  .item-row.low  { background: rgba(249,115,22,0.06); }
  .item-row td { padding: 10px 8px; vertical-align: middle; }
  .item-name { font-size: 14px; font-weight: 500; }
  .item-status {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
    display: inline-block; margin-left: 6px;
  }
  .item-status.ok     { background: #14532d; color: #86efac; }
  .item-status.low    { background: #431407; color: #fdba74; }
  .item-status.zero   { background: #450a0a; color: #f87171; }
  .qty-cell { text-align: center; min-width: 80px; }
  .qty-val {
    font-size: 22px; font-weight: 800; cursor: pointer;
    transition: color 0.15s; display: inline-block;
  }
  .qty-val:hover { color: var(--red); }
  .qty-val.zero { color: var(--red); }
  .qty-val.low  { color: var(--orange); }
  .qty-unit { font-size: 10px; color: var(--muted); }
  .actions-cell { text-align: right; white-space: nowrap; }
  .btn-sm {
    width: 32px; height: 32px; border-radius: 7px; border: none; cursor: pointer;
    font-size: 17px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-sm:active { transform: scale(0.9); }
  .btn-plus  { background: #14532d; color: var(--green); }
  .btn-minus { background: #450a0a; color: #f87171; }
  .btn-mov   { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
               font-size: 11px; font-weight: 600; cursor: pointer; background: var(--surface2); color: var(--muted);
               margin-left: 4px; }
  .btn-mov:hover { color: var(--text); border-color: #555; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex;
    align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .modal-overlay.hidden { display: none; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; width: 100%; max-width: 360px; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .modal-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .modal label { font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.5px; display: block; margin-bottom: 5px; margin-top: 12px; }
  .modal input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; outline: none;
  }
  .modal input:focus { border-color: var(--red); }
  .modal input[type="number"] { font-size: 26px; font-weight: 700; text-align: center; }
  .unit-selector { display: flex; gap: 6px; margin-top: 4px; }
  .unit-btn {
    flex: 1; padding: 8px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .unit-btn.active { border-color: var(--red); color: var(--red); background: rgba(232,39,26,0.1); }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .btn-confirm {
    flex: 1; padding: 12px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity 0.15s;
  }
  .btn-confirm:hover { opacity: 0.85; }
  .btn-confirm.entrada { background: var(--green); color: #000; }
  .btn-confirm.saida   { background: #ef4444; color: #fff; }
  .btn-confirm.ajuste  { background: var(--red); color: #fff; }
  .btn-cancel {
    padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 14px; font-weight: 600; cursor: pointer; background: transparent; color: var(--muted);
  }

  /* HISTÓRICO */
  .hist-list { max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .hist-item {
    padding: 8px 10px; border-radius: 8px; background: var(--surface2);
    display: flex; gap: 8px; align-items: center;
  }
  .hist-icon { font-size: 15px; min-width: 22px; text-align: center; }
  .hist-detail { flex: 1; }
  .hist-detail strong { font-size: 13px; display: block; }
  .hist-detail span { font-size: 11px; color: var(--muted); }
  .hist-qty { font-size: 13px; font-weight: 700; }
  .hist-qty.pos { color: var(--green); }
  .hist-qty.neg { color: #f87171; }

  /* LOADING / ERROR */
  .loader { text-align: center; padding: 60px 20px; color: var(--muted); }
  .loader .spin { font-size: 36px; animation: spin 1s linear infinite; display: block; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 10px 20px; border-radius: 8px;
    font-size: 13px; font-weight: 500; z-index: 300;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 480px) {
    .item-table th.hide-mob, .item-row td.hide-mob { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">CDC<span>Fit</span></div>
  <div style="width:1px;height:24px;background:var(--border)"></div>
  <span style="font-size:14px;font-weight:600;">Estoque Matéria Prima</span>
  <span id="clock"></span>
</header>

<div class="toolbar">
  <input class="search-box" type="text" id="searchInput" placeholder="🔍 Buscar ingrediente..." oninput="render()">
  <button class="btn-tool" onclick="openHistGeral()">📋 Histórico</button>
  <button class="btn-tool" onclick="exportCSV()">⬇ CSV</button>
  <button class="btn-tool" onclick="loadItems()" id="btnSync">🔄 Sync</button>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat"><div class="stat-val">—</div><div class="stat-label">Carregando...</div></div>
</div>

<div class="filters" id="filters"></div>

<div id="main"><div class="loader"><span class="spin">⏳</span>Conectando ao banco...</div></div>

<!-- MODAL MOVIMENTO -->
<div class="modal-overlay hidden" id="modalMov">
  <div class="modal">
    <div class="modal-title" id="movTitle">Entrada</div>
    <div class="modal-subtitle" id="movSubtitle">—</div>
    <label>Quantidade</label>
    <input type="number" id="movQty" value="1" min="0.1" step="0.1">
    <label>Unidade</label>
    <div class="unit-selector" id="unitSelector">
      <button class="unit-btn active" data-unit="un" onclick="setUnit('un')">un</button>
      <button class="unit-btn" data-unit="kg" onclick="setUnit('kg')">kg</button>
      <button class="unit-btn" data-unit="L" onclick="setUnit('L')">L</button>
      <button class="unit-btn" data-unit="g" onclick="setUnit('g')">g</button>
      <button class="unit-btn" data-unit="cx" onclick="setUnit('cx')">cx</button>
      <button class="unit-btn" data-unit="pct" onclick="setUnit('pct')">pct</button>
    </div>
    <label>Observação (opcional)</label>
    <input type="text" id="movObs" placeholder="Ex: compra fornecedor, devolução...">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeMov()">Cancelar</button>
      <button class="btn-confirm" id="btnMovConfirm" onclick="confirmMov()">Confirmar</button>
    </div>
  </div>
</div>

<!-- MODAL AJUSTE -->
<div class="modal-overlay hidden" id="modalAjuste">
  <div class="modal">
    <div class="modal-title">Ajuste de Estoque</div>
    <div class="modal-subtitle" id="ajSubtitle">—</div>
    <label>Quantidade atual</label>
    <input type="number" id="ajQty" value="0" min="0" step="0.1">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAjuste()">Cancelar</button>
      <button class="btn-confirm ajuste" onclick="confirmAjuste()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL HISTÓRICO -->
<div class="modal-overlay hidden" id="modalHist">
  <div class="modal" style="max-width:460px">
    <div class="modal-title" id="histTitle">Histórico</div>
    <div class="modal-subtitle" id="histSubtitle"></div>
    <div class="hist-list" id="histList"></div>
    <div class="modal-actions">
      <button class="btn-cancel" style="flex:1" onclick="closeHist()">Fechar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const SUPABASE_URL  = 'https://slqcvqshhxftvmeiwcnu.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNscWN2cXNoaHhmdHZtZWl3Y251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODIwOTMsImV4cCI6MjA5NDE1ODA5M30.FLGWl-NRePxoxItGT0GM2C3XjwbON89eRJWo6Uc7hgQ'; // ← único campo a preencher

const LOW_THRESHOLD = 3; // abaixo disso = "baixo"

const CATS = {
  proteinas:  { label: 'Proteínas',    emoji: '🥩', color: '#dc2626' },
  hortifruti: { label: 'Hortifruti',   emoji: '🥦', color: '#16a34a' },
  laticinios: { label: 'Laticínios',   emoji: '🧀', color: '#ca8a04' },
  temperos:   { label: 'Temperos',     emoji: '🧂', color: '#7c3aed' },
  seco:       { label: 'Estoque Seco', emoji: '📦', color: '#0369a1' },
  limpeza:    { label: 'Limpeza',      emoji: '🧹', color: '#0f766e' },
  massas:     { label: 'Massas',       emoji: '🍝', color: '#c2410c' },
  doces:      { label: 'Doces',        emoji: '🍰', color: '#be185d' },
};
const CAT_ORDER = Object.keys(CATS);

// ─── STATE ───────────────────────────────────────────────────────────────────
let sb, items = [], activeCat = 'TODOS', movState = {}, ajState = {}, movUnit = 'un';
let localHist = [];
try { localHist = JSON.parse(localStorage.getItem('cdcfit_mp_hist') || '[]'); } catch(_) {}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  if (SUPABASE_KEY === 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNscWN2cXNoaHhmdHZtZWl3Y251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODIwOTMsImV4cCI6MjA5NDE1ODA5M30.FLGWl-NRePxoxItGT0GM2C3XjwbON89eRJWo6Uc7hgQ') {
    document.getElementById('main').innerHTML = `
      <div class="loader">
        <span style="font-size:36px;display:block;margin-bottom:12px">🔑</span>
        <strong style="color:var(--red)">Chave Supabase não configurada</strong><br><br>
        <span style="font-size:13px">Abra este arquivo num editor e substitua<br>
        <code style="background:var(--surface2);padding:2px 6px;border-radius:4px">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNscWN2cXNoaHhmdHZtZWl3Y251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODIwOTMsImV4cCI6MjA5NDE1ODA5M30.FLGWl-NRePxoxItGT0GM2C3XjwbON89eRJWo6Uc7hgQ</code><br>
        pela sua anon key do Supabase.<br><br>
        Supabase → Settings → API → anon public</span>
      </div>`;
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  await loadItems();
  renderFilters();
  // realtime
  sb.channel('items-mp')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'items' }, payload => {
      const idx = items.findIndex(i => i.id === payload.new.id);
      if (idx >= 0) { items[idx] = payload.new; render(); }
    }).subscribe();
}

async function loadItems() {
  document.getElementById('btnSync').textContent = '⏳';
  try {
    const { data, error } = await sb.from('items').select('*').order('name');
    if (error) throw error;
    items = data || [];
    render();
    renderFilters();
    renderStats();
    document.getElementById('btnSync').textContent = '🔄 Sync';
    showToast('Estoque atualizado');
  } catch(e) {
    document.getElementById('main').innerHTML = `
      <div class="loader"><span style="font-size:36px;display:block;margin-bottom:12px">❌</span>
      Erro ao conectar: ${e.message}</div>`;
    document.getElementById('btnSync').textContent = '🔄 Sync';
  }
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderFilters() {
  const catsPresent = [...new Set(items.map(i => i.category))];
  const all = ['TODOS', ...CAT_ORDER.filter(c => catsPresent.includes(c))];
  document.getElementById('filters').innerHTML = all.map(c => {
    const info = CATS[c];
    const style = c !== 'TODOS' && c === activeCat ? `background:${info?.color};border-color:transparent;color:#fff` :
                  activeCat === 'TODOS' && c === 'TODOS' ? `background:var(--red);border-color:transparent;color:#fff` : '';
    return `<button class="filter-btn ${activeCat===c?'active':''}" style="${style}" onclick="setFilter('${c}')">
      ${info ? info.emoji + ' ' : ''}${info ? info.label : 'Todos'}
    </button>`;
  }).join('');
}

function setFilter(cat) { activeCat = cat; renderFilters(); render(); }

function renderStats() {
  const total = items.length;
  const zeroed = items.filter(i => (i.stock_quantity || 0) === 0).length;
  const low = items.filter(i => (i.stock_quantity || 0) > 0 && (i.stock_quantity || 0) <= LOW_THRESHOLD).length;
  const ok = total - zeroed - low;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-val">${total}</div><div class="stat-label">Total itens</div></div>
    <div class="stat"><div class="stat-val green">${ok}</div><div class="stat-label">OK</div></div>
    <div class="stat"><div class="stat-val orange">${low}</div><div class="stat-label">Baixo</div></div>
    <div class="stat"><div class="stat-val red">${zeroed}</div><div class="stat-label">Zerados</div></div>
  `;
}

function getStatus(qty) {
  if (qty === 0)           return { label: 'ZERADO', cls: 'zero' };
  if (qty <= LOW_THRESHOLD) return { label: 'BAIXO',  cls: 'low'  };
  return { label: 'OK', cls: 'ok' };
}

function render() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let filtered = items.filter(i => {
    const matchCat = activeCat === 'TODOS' || i.category === activeCat;
    const matchQ   = !search || i.name.toLowerCase().includes(search);
    return matchCat && matchQ;
  });

  if (!filtered.length) {
    document.getElementById('main').innerHTML = `<div class="loader"><span style="font-size:36px;display:block;margin-bottom:12px">🔍</span>Nenhum item encontrado</div>`;
    return;
  }

  // agrupar por categoria
  const groups = {};
  (activeCat === 'TODOS' ? CAT_ORDER : [activeCat]).forEach(cat => {
    const its = filtered.filter(i => i.category === cat);
    if (its.length) groups[cat] = its;
  });

  let html = '';
  for (const [cat, its] of Object.entries(groups)) {
    const info = CATS[cat] || { label: cat, emoji: '📦', color: '#888' };
    html += `
    <div class="section cat-color-${cat}">
      <div class="section-header">
        <div class="section-dot"></div>
        <span class="section-title">${info.emoji} ${info.label}</span>
        <span class="section-count">${its.length} itens</span>
      </div>
      <table class="item-table">
        <thead>
          <tr>
            <th>Item</th>
            <th style="text-align:center;width:100px">Estoque</th>
            <th style="text-align:right;width:140px" class="hide-mob">Ações</th>
          </tr>
        </thead>
        <tbody>
          ${its.map(item => {
            const qty = item.stock_quantity || 0;
            const st  = getStatus(qty);
            return `
            <tr class="item-row ${st.cls}" id="row-${item.id}">
              <td>
                <span class="item-name">${item.name}</span>
                <span class="item-status ${st.cls}">${st.label}</span>
              </td>
              <td class="qty-cell">
                <span class="qty-val ${st.cls}" onclick="openAjuste('${item.id}','${item.name}',${qty})" title="Clique para ajustar">${qty % 1 === 0 ? qty : qty.toFixed(1)}</span>
                <div class="qty-unit">unid.</div>
              </td>
              <td class="actions-cell hide-mob">
                <button class="btn-sm btn-plus"  onclick="quick('${item.id}',1)"  title="+1">＋</button>
                <button class="btn-sm btn-minus" onclick="quick('${item.id}',-1)" title="−1">－</button>
                <button class="btn-mov" onclick="openMov('${item.id}','${item.name}',${qty},'entrada')">Entrada</button>
                <button class="btn-mov" onclick="openMov('${item.id}','${item.name}',${qty},'saida')">Saída</button>
              </td>
            </tr>
            <!-- mobile row -->
            <tr class="item-row" style="display:none" id="mob-${item.id}"></tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
  }

  // mobile action rows
  document.getElementById('main').innerHTML = html;

  // inject mobile rows
  items.forEach(item => {
    const mob = document.getElementById(`mob-${item.id}`);
    if (!mob) return;
    const row = document.getElementById(`row-${item.id}`);
    if (!row) return;
    // show action buttons below on small screens via media
    mob.remove(); // cleanup since we handle via CSS hide-mob
  });

  // add mobile buttons inside existing rows for screens without hide-mob support
  renderStats();
}

// ─── QUICK +/- ───────────────────────────────────────────────────────────────
async function quick(id, delta) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  const current = item.stock_quantity || 0;
  if (delta < 0 && current <= 0) { showToast('Estoque zerado'); return; }
  const newQty = Math.max(0, +(current + delta).toFixed(2));
  await updateStock(id, newQty, delta > 0 ? 'entrada' : 'saida', Math.abs(delta), '', 'un');
}

// ─── UPDATE SUPABASE ──────────────────────────────────────────────────────────
async function updateStock(id, newQty, tipo, qty, obs, unit) {
  const item = items.find(i => i.id === id);
  const { error } = await sb.from('items').update({ stock_quantity: newQty }).eq('id', id);
  if (error) { showToast('Erro: ' + error.message); return; }
  item.stock_quantity = newQty;
  // histórico local
  localHist.unshift({ id, name: item.name, tipo, qty, unit, obs, ts: new Date().toISOString() });
  if (localHist.length > 500) localHist = localHist.slice(0,500);
  try { localStorage.setItem('cdcfit_mp_hist', JSON.stringify(localHist)); } catch(_) {}
  render();
  const sign = tipo === 'entrada' ? '+' : '−';
  showToast(`${sign}${qty}${unit} em "${item.name}"`);
}

// ─── MODAL MOVIMENTO ─────────────────────────────────────────────────────────
function openMov(id, name, currentQty, tipo) {
  movState = { id, name, currentQty, tipo };
  document.getElementById('movTitle').textContent = tipo === 'entrada' ? '📦 Entrada' : '📤 Saída';
  document.getElementById('movSubtitle').textContent = name;
  document.getElementById('movQty').value = 1;
  document.getElementById('movObs').value = '';
  movUnit = 'un'; setUnit('un');
  const btn = document.getElementById('btnMovConfirm');
  btn.textContent = tipo === 'entrada' ? 'Confirmar Entrada' : 'Confirmar Saída';
  btn.className = `btn-confirm ${tipo}`;
  document.getElementById('modalMov').classList.remove('hidden');
  setTimeout(() => document.getElementById('movQty').focus(), 80);
}
function closeMov() { document.getElementById('modalMov').classList.add('hidden'); }
function setUnit(u) {
  movUnit = u;
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.toggle('active', b.dataset.unit === u));
}
async function confirmMov() {
  const { id, name, currentQty, tipo } = movState;
  const qty = parseFloat(document.getElementById('movQty').value) || 0;
  const obs = document.getElementById('movObs').value.trim();
  if (qty <= 0) { showToast('Quantidade inválida'); return; }
  if (tipo === 'saida' && currentQty < qty) { showToast('Estoque insuficiente'); return; }
  const newQty = Math.max(0, +(currentQty + (tipo === 'entrada' ? qty : -qty)).toFixed(2));
  closeMov();
  await updateStock(id, newQty, tipo, qty, obs, movUnit);
}

// ─── MODAL AJUSTE ─────────────────────────────────────────────────────────────
function openAjuste(id, name, currentQty) {
  ajState = { id, name, currentQty };
  document.getElementById('ajSubtitle').textContent = name;
  document.getElementById('ajQty').value = currentQty;
  document.getElementById('modalAjuste').classList.remove('hidden');
  setTimeout(() => document.getElementById('ajQty').select(), 80);
}
function closeAjuste() { document.getElementById('modalAjuste').classList.add('hidden'); }
async function confirmAjuste() {
  const { id, name, currentQty } = ajState;
  const qty = parseFloat(document.getElementById('ajQty').value);
  if (isNaN(qty) || qty < 0) { showToast('Valor inválido'); return; }
  closeAjuste();
  await updateStock(id, qty, 'ajuste', qty, `anterior: ${currentQty}`, 'un');
}

// ─── HISTÓRICO ────────────────────────────────────────────────────────────────
function openHistGeral() {
  document.getElementById('histTitle').textContent = 'Histórico Geral';
  document.getElementById('histSubtitle').textContent = `${localHist.length} movimentos`;
  document.getElementById('histList').innerHTML = histHTML(localHist.slice(0,80));
  document.getElementById('modalHist').classList.remove('hidden');
}
function closeHist() { document.getElementById('modalHist').classList.add('hidden'); }
function histHTML(list) {
  if (!list.length) return '<div style="color:var(--muted);text-align:center;padding:20px;font-size:13px">Sem movimentos</div>';
  return list.map(h => {
    const icon = h.tipo === 'entrada' ? '📦' : h.tipo === 'saida' ? '📤' : '✏️';
    const qtyClass = h.tipo === 'entrada' ? 'pos' : h.tipo === 'saida' ? 'neg' : '';
    const sign = h.tipo === 'entrada' ? '+' : h.tipo === 'saida' ? '−' : '=';
    const dt = new Date(h.ts);
    const dtStr = dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
    return `<div class="hist-item">
      <div class="hist-icon">${icon}</div>
      <div class="hist-detail">
        <strong>${h.name}</strong>
        <span>${dtStr}${h.obs ? ' · ' + h.obs : ''}</span>
      </div>
      <div class="hist-qty ${qtyClass}">${sign}${h.qty}${h.unit}</div>
    </div>`;
  }).join('');
}

// ─── EXPORT CSV ───────────────────────────────────────────────────────────────
function exportCSV() {
  const lines = ['Item,Categoria,Estoque'];
  items.forEach(i => lines.push(`"${i.name}","${CATS[i.category]?.label||i.category}",${i.stock_quantity||0}`));
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `estoque-mp-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  showToast('CSV exportado!');
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── RELÓGIO ─────────────────────────────────────────────────────────────────
function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
setInterval(tick, 1000); tick();

// ─── TECLADO ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMov(); closeAjuste(); closeHist(); }
  if (e.key === 'Enter') {
    if (!document.getElementById('modalMov').classList.contains('hidden'))    confirmMov();
    else if (!document.getElementById('modalAjuste').classList.contains('hidden')) confirmAjuste();
  }
});

init();
</script>
</body>
</html>
